name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一个分支有新的推送时，取消还在跑的旧检查
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: make check
